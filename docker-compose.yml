# Purpose: run each ईMAIL infrastructure component in an isolated Compose container.

name: meow

services:
  # Publish the same-origin API on loopback for Funnel and the configured LAN address for local devices.
  api:
    build: .
    command: ["npm", "run", "start:api"]
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SMTP_HOST: smtp
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:${HOST_API_PORT:-3000}:3000"
      - "${HOST_LAN_IP:?Set HOST_LAN_IP to this computer's Wi-Fi IPv4 address}:${HOST_API_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      smtp:
        condition: service_started
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [meow_internal]

  # Build and serve the React account UI inside Compose behind the API entry point.
  frontend:
    build: ./frontend
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/_frontend_health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [meow_internal]

  # Poll MongoDB independently from the API and perform outbound call dispatches.
  call-worker:
    build: .
    command: ["npm", "run", "start:worker"]
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SMTP_HOST: smtp
      SMTP_PORT: 1025
    depends_on:
      mongodb:
        condition: service_healthy
      smtp:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [meow_internal]

  # Store application data with local authentication and no published host port.
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: meow
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [meow_internal]

  # Keep a private SMTP sink for local development; the MongoDB mailbox does not use it.
  smtp:
    image: axllent/mailpit:v1.27
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    volumes:
      - smtp_data:/data
    expose:
      - "1025"
    restart: unless-stopped
    networks: [meow_internal]

volumes:
  # Keep account, call, reset-code, and event history across container recreation.
  mongodb_data:
  # Keep the local SMTP sink's development messages across container recreation.
  smtp_data:

networks:
  # A shared private bridge lets API, worker, MongoDB, and SMTP reach only each other directly.
  meow_internal:
    driver: bridge
